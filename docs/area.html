<!DOCTYPE HTML>
<html>
    <head>
        <title>Area Light Plus</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
        <link rel="stylesheet" href="assets/css/main.css" />
        <noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
    </head>
    <body class="is-preload" style="background-color: #ffffff; background-image: none; color: #444444;">

        <div id="wrapper">
            <div id="main">

                <ul class="features">
					<li>
						<strong>Rectangle Area Light</strong>

						<div class="comparison-container">
							<div class="image-wrapper">
								<img src="images/area_rectangle_after.jpg" alt="With" class="img-back">
								
								<div class="img-front-container">
									<img src="images/area_rectangle_before.jpg" alt="Without" class="img-front">
									<span class="label label-left">Without</span>
								</div>
								<span class="label label-right">With</span>
							</div>
							<input type="range" min="0" max="100" value="50" class="slider">
							<div class="slider-button"></div>
						</div>
					</li>

					<li>
						<strong>Triangle Area Light</strong>

						<div class="comparison-container">
							<div class="image-wrapper">
								<img src="images/area_triangle_after.jpg" alt="With" class="img-back">
												
								<div class="img-front-container">
									<img src="images/area_triangle_before.jpg" alt="Without" class="img-front">
									<span class="label label-left">Without</span>
								</div>
								<span class="label label-right">With</span>
							</div>
							<input type="range" min="0" max="100" value="50" class="slider">
							<div class="slider-button"></div>
						</div>
					</li>
				</ul>

            </div>
        </div>

        <script src="assets/js/jquery.min.js"></script>
        <script src="assets/js/jquery.scrollex.min.js"></script>
        <script src="assets/js/jquery.scrolly.min.js"></script>
        <script src="assets/js/browser.min.js"></script>
        <script src="assets/js/breakpoints.min.js"></script>
        <script src="assets/js/util.js"></script>
        <script src="assets/js/main.js"></script>

    </body>
</html>
